---
- name: Configure NAS NFS mounts on NUC5
  hosts: pve-nuc5-edge
  become: true
  gather_facts: false

  tasks:
    - name: Install nfs-common
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true

    - name: Ensure NAS mount point exists
      ansible.builtin.file:
        path: /mnt/nas-backups
        state: directory
        mode: '0755'
      ignore_errors: true

    - name: Mount NAS backups share via fstab
      ansible.posix.mount:
        path: /mnt/nas-backups
        src: 192.168.1.221:/volume1/backups
        fstype: nfs
        opts: defaults,_netdev
        state: mounted

    - name: Deploy nas-backup-sync script
      ansible.builtin.copy:
        dest: /usr/local/bin/nas-backup-sync.sh
        mode: '0755'
        content: |
          #!/bin/bash
          LOGFILE=/var/log/nas-backup-sync.log
          DISCORD_WEBHOOK="https://discord.com/api/webhooks/1522967702547988553/cV90stFYA86JQvQsgVydb6zj8kR4Xa_fHFbIyxauMNZskyTwhw7bUjrM8vhgMkRQLPhC"
          log() { echo "$(date '+%Y-%m-%d %H:%M:%S') $1" >> $LOGFILE; }
          discord() {
            curl -s -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$1\"}" > /dev/null 2>&1
          }
          log "Starting PBS backup sync to NAS"
          pct stop 103
          sleep 5
          mkdir -p /mnt/pbs-data
          mount /dev/pve/vm-103-disk-0 /mnt/pbs-data
          rsync -av --delete --no-owner --no-group --no-perms --omit-dir-times \
            /mnt/pbs-data/var/lib/pbs-backups/ \
            /mnt/nas-backups/pbs-backups/ >> $LOGFILE 2>&1
          RESULT=$?
          umount /mnt/pbs-data
          pct start 103
          if [ $RESULT -eq 0 ]; then
            log "Sync completed successfully"
            discord "INFO: PBS backup sync to NAS completed successfully"
          else
            log "Sync FAILED"
            discord "CRITICAL: PBS backup sync to NAS FAILED — check /var/log/nas-backup-sync.log"
          fi

    - name: Create nas-backup-sync systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/nas-backup-sync.service
        content: |
          [Unit]
          Description=Sync PBS backups to NAS
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/nas-backup-sync.sh

    - name: Create nas-backup-sync systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/nas-backup-sync.timer
        content: |
          [Unit]
          Description=Sync PBS backups to NAS every 2 weeks

          [Timer]
          OnCalendar=*-*-1,15 03:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable and start nas-backup-sync timer
      ansible.builtin.systemd:
        name: nas-backup-sync.timer
        enabled: true
        state: started
        daemon_reload: true
