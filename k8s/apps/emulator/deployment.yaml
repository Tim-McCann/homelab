apiVersion: v1
kind: Namespace
metadata:
  name: emulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emulatorjs
  namespace: emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emulatorjs
  template:
    metadata:
      labels:
        app: emulatorjs
    spec:
      containers:
        - name: emulatorjs
          image: linuxserver/emulatorjs:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Chicago"
          ports:
            - containerPort: 3000
              name: webui
            - containerPort: 80
              name: emulator
          volumeMounts:
            - name: roms
              mountPath: /data/roms
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: roms
          persistentVolumeClaim:
            claimName: emulator-roms-pvc
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: emulatorjs
  namespace: emulator
spec:
  selector:
    app: emulatorjs
  ports:
    - name: webui
      port: 3000
      targetPort: 3000
    - name: emulator
      port: 80
      targetPort: 80
