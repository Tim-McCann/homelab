apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-db-pvc
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-db
  namespace: romm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm-db
  template:
    metadata:
      labels:
        app: romm-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: db-root-password
            - name: MYSQL_DATABASE
              value: romm
            - name: MYSQL_USER
              value: romm
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: db-password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: romm-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: romm-db
  namespace: romm
spec:
  selector:
    app: romm-db
  ports:
    - port: 3306
      targetPort: 3306
