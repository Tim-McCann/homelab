apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-roms-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.1.221
    path: /volume1/roms/roms
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-roms-pvc
  namespace: romm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  volumeName: romm-roms-pv
  storageClassName: ""
