apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-assets-pvc
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-config-pvc
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-app
  namespace: romm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm-app
  template:
    metadata:
      labels:
        app: romm-app
    spec:
      containers:
        - name: romm-app
          image: rommapp/romm:latest
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: db-password
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secret
                  key: romm-auth-secret-key
            - name: ROMM_HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: roms
              mountPath: /romm/library
            - name: assets
              mountPath: /romm/assets
            - name: config
              mountPath: /romm/config
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: roms
          persistentVolumeClaim:
            claimName: romm-roms-pvc
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets-pvc
        - name: config
          persistentVolumeClaim:
            claimName: romm-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: romm-app
  namespace: romm
spec:
  selector:
    app: romm-app
  ports:
    - port: 8080
      targetPort: 8080
