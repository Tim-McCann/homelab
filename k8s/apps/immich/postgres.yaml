apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  postgresUID: 26
  postgresGID: 102
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-secret
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector";
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "unaccent";
